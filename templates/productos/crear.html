{% extends 'base.html' %}

{% block title %}Nuevo Producto{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1><i class="bi bi-box-seam"></i> Nuevo Producto</h1>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="codigo" class="form-label">Código</label>
                    <input type="text" class="form-control" name="codigo" required maxlength="30">
                </div>
                <div class="col-md-4">
                    <label for="unidad_medida" class="form-label">Unidad de Medida</label>
                    <select class="form-select" name="unidad_medida">
                        <option value="NIU">NIU (Unidad)</option>
                        <option value="KG">KG (Kilogramo)</option>
                        <option value="GR">GR (Gramo)</option>
                        <option value="LT">LT (Litro)</option>
                        <option value="ML">ML (Mililitro)</option>
                        <option value="M">M (Metro)</option>
                        <option value="UM">UM (Millar)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="precio_unitario" class="form-label">Precio Unitario</label>
                    <input type="number" class="form-control" name="precio_unitario" required step="0.01" min="0">
                </div>
            </div>
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" name="descripcion" rows="2" required maxlength="500"></textarea>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="cod_tipo_afectacion" class="form-label">Tipo de Afectación IGV</label>
                    <select class="form-select" name="cod_tipo_afectacion">
                        <option value="10">10 - Gravado</option>
                        <option value="11">11 - Gravado - Retiro por奖励</option>
                        <option value="12">12 - Gravado - Rebaja</option>
                        <option value="14">14 - Transacciones gratuitas</option>
                        <option value="20">20 - Exonerado</option>
                        <option value="30">30 - Inafecto</option>
                        <option value="40">40 - Exportación</option>
                    </select>
                </div>
                <div class="col-md-6 d-flex align-items-center">
                    <div class="form-check mt-4">
                        <input type="checkbox" class="form-check-input" name="afecto_igv" id="afecto_igv" checked>
                        <label class="form-check-label" for="afecto_igv">Afecto a IGV (18%)</label>
                    </div>
                </div>
            </div>
            {% if errors %}
            <div class="alert alert-danger">
                {% for field, errors in errors.items %}
                    {% for error in errors %}
                        <div>{{ error }}</div>
                    {% endfor %}
                {% endfor %}
            </div>
            {% endif %}
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{% url 'productos:lista' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
