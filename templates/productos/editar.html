{% extends 'base.html' %}

{% block title %}Editar Producto{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-display font-semibold text-slate-800 flex items-center gap-3">
        <i class="bi bi-box-seam text-primary-600"></i> Editar Producto
    </h1>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
    <form method="POST" class="space-y-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <label for="codigo" class="block text-sm font-medium text-slate-700 mb-2">Código</label>
                <input type="text" name="codigo" id="codigo" required maxlength="30" value="{{ producto.codigo }}"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
            </div>
            <div>
                <label for="categoria" class="block text-sm font-medium text-slate-700 mb-2">Categoría</label>
                <select name="categoria" id="categoria" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
                    <option value="">-- Sin categoría --</option>
                    {% for cat in categorias %}
                    <option value="{{ cat.id }}" {% if producto.categoria_id == cat.id %}selected{% endif %}>{{ cat.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="tipo_operacion" class="block text-sm font-medium text-slate-700 mb-2">Tipo de Operación</label>
                <select name="tipo_operacion" id="tipo_operacion" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
                    <option value="GRAVADA" {% if producto.tipo_operacion == 'GRAVADA' %}selected{% endif %}>Gravada</option>
                    <option value="EXONERADA" {% if producto.tipo_operacion == 'EXONERADA' %}selected{% endif %}>Exonerada</option>
                    <option value="INAFECTA" {% if producto.tipo_operacion == 'INAFECTA' %}selected{% endif %}>Inafecta</option>
                    <option value="GRATUITA" {% if producto.tipo_operacion == 'GRATUITA' %}selected{% endif %}>Operación Gratuita</option>
                    <option value="EXPORTACION" {% if producto.tipo_operacion == 'EXPORTACION' %}selected{% endif %}>Exportación</option>
                </select>
            </div>
        </div>
        <div>
            <label for="descripcion" class="block text-sm font-medium text-slate-700 mb-2">Descripción</label>
            <textarea name="descripcion" id="descripcion" rows="2" required maxlength="500"
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">{{ producto.descripcion }}</textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div>
                <label for="unidad_medida" class="block text-sm font-medium text-slate-700 mb-2">Unidad de Medida</label>
                <select name="unidad_medida" id="unidad_medida" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
                    <option value="NIU" {% if producto.unidad_medida == 'NIU' %}selected{% endif %}>NIU (Unidad)</option>
                    <option value="KG" {% if producto.unidad_medida == 'KG' %}selected{% endif %}>KG (Kilogramo)</option>
                    <option value="GR" {% if producto.unidad_medida == 'GR' %}selected{% endif %}>GR (Gramo)</option>
                    <option value="LT" {% if producto.unidad_medida == 'LT' %}selected{% endif %}>LT (Litro)</option>
                    <option value="ML" {% if producto.unidad_medida == 'ML' %}selected{% endif %}>ML (Mililitro)</option>
                    <option value="M" {% if producto.unidad_medida == 'M' %}selected{% endif %}>M (Metro)</option>
                    <option value="UM" {% if producto.unidad_medida == 'UM' %}selected{% endif %}>UM (Millar)</option>
                </select>
            </div>
            <div>
                <label for="precio_unitario" class="block text-sm font-medium text-slate-700 mb-2">Precio Unitario</label>
                <input type="number" name="precio_unitario" id="precio_unitario" required step="0.01" min="0" value="{{ producto.precio_unitario }}"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
            </div>
            <div>
                <label for="cod_tipo_afectacion" class="block text-sm font-medium text-slate-700 mb-2">Código Afectación IGV</label>
                <select name="cod_tipo_afectacion" id="cod_tipo_afectacion" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
                    <option value="10" {% if producto.cod_tipo_afectacion == '10' %}selected{% endif %}>10 - Gravado</option>
                    <option value="11" {% if producto.cod_tipo_afectacion == '11' %}selected{% endif %}>11 - Gravado - Consignación</option>
                    <option value="14" {% if producto.cod_tipo_afectacion == '14' %}selected{% endif %}>14 - Transacciones gratuitas</option>
                    <option value="20" {% if producto.cod_tipo_afectacion == '20' %}selected{% endif %}>20 - Exonerado</option>
                    <option value="30" {% if producto.cod_tipo_afectacion == '30' %}selected{% endif %}>30 - Inafecto</option>
                    <option value="40" {% if producto.cod_tipo_afectacion == '40' %}selected{% endif %}>40 - Exportación</option>
                </select>
            </div>
            <div class="flex items-center">
                <div class="flex items-center h-5">
                    <input type="checkbox" name="afecto_igv" id="afecto_igv" {% if producto.afecto_igv %}checked{% endif %}
                        class="w-4 h-4 text-primary-600 border-slate-300 rounded focus:ring-primary-500">
                </div>
                <div class="ml-3">
                    <label for="afecto_igv" class="text-sm font-medium text-slate-700">Afecto a IGV (18%)</label>
                </div>
            </div>
        </div>
        {% if errors %}
        <div class="p-4 rounded-xl bg-red-50 text-red-700 border border-red-200">
            {% for field, errors in errors.items %}
                {% for error in errors %}
                    <div>{{ error }}</div>
                {% endfor %}
            {% endfor %}
        </div>
        {% endif %}
        <div class="flex justify-end gap-3">
            <a href="{% url 'productos:lista' %}" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium transition">
                Cancelar
            </a>
            <button type="submit" class="px-5 py-2.5 bg-primary-500 hover:bg-primary-600 text-white rounded-xl font-medium transition shadow-lg shadow-primary-500/30 flex items-center gap-2">
                <i class="bi bi-save"></i> Guardar Cambios
            </button>
        </div>
    </form>
</div>
{% endblock %}
