{% extends 'base.html' %}

{% block title %}Nueva Categoría{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-display font-semibold text-slate-800 flex items-center gap-3">
        <i class="bi bi-tags text-primary-600"></i> Nueva Categoría
    </h1>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
    <form method="POST" class="space-y-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="nombre" class="block text-sm font-medium text-slate-700 mb-2">Nombre</label>
                <input type="text" name="nombre" id="nombre" required maxlength="100"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
            </div>
            <div>
                <label for="codigo_sunat" class="block text-sm font-medium text-slate-700 mb-2">Código SUNAT</label>
                <input type="text" name="codigo_sunat" id="codigo_sunat" maxlength="10" placeholder="Ej: 241000"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
            </div>
        </div>
        <div>
            <label for="descripcion" class="block text-sm font-medium text-slate-700 mb-2">Descripción</label>
            <textarea name="descripcion" id="descripcion" rows="3" placeholder="Descripción opcional..."
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition"></textarea>
        </div>
        <div class="flex items-center">
            <div class="flex items-center h-5">
                <input type="checkbox" name="activa" id="activa" checked
                    class="w-4 h-4 text-primary-600 border-slate-300 rounded focus:ring-primary-500">
            </div>
            <div class="ml-3">
                <label for="activa" class="text-sm font-medium text-slate-700">Categoría activa</label>
            </div>
        </div>
        {% if errors %}
        <div class="p-4 rounded-xl bg-red-50 text-red-700 border border-red-200">
            {% for field, errors in errors.items %}
                {% for error in errors %}
                    <div>{{ error }}</div>
                {% endfor %}
            {% endfor %}
        </div>
        {% endif %}
        <div class="flex justify-end gap-3">
            <a href="{% url 'productos:categorias_lista' %}" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium transition">
                Cancelar
            </a>
            <button type="submit" class="px-5 py-2.5 bg-primary-500 hover:bg-primary-600 text-white rounded-xl font-medium transition shadow-lg shadow-primary-500/30 flex items-center gap-2">
                <i class="bi bi-save"></i> Guardar
            </button>
        </div>
    </form>
</div>
{% endblock %}
