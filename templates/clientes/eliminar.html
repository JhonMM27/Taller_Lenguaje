{% extends 'base.html' %}

{% block title %}Eliminar Cliente{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1><i class="bi bi-exclamation-triangle text-danger"></i> Eliminar Cliente</h1>
    </div>
</div>

<div class="card border-danger">
    <div class="card-body">
        <p>¿Está seguro que desea eliminar al cliente <strong>{{ cliente.razon_social }}</strong>?</p>
        <p class="text-muted">Documento: {{ cliente.get_tipo_doc_display }} {{ cliente.num_doc }}</p>
        <form method="POST">
            {% csrf_token %}
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{% url 'clientes:lista' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i> Eliminar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
