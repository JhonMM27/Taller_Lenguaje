<!-- Modal Nuevo Comprobante -->
<div class="modal-overlay" id="nuevoComprobanteModal">
    <div class="modal-content" style="max-width:900px;">
        <div class="modal-header">
            <h2 class="modal-title">
                <i class="bi bi-receipt" style="color:var(--primary-600);"></i>
                Nuevo Comprobante
            </h2>
            <button class="modal-close" onclick="closeModal('nuevoComprobanteModal')">
                <i class="bi bi-x"></i>
            </button>
        </div>
        <div class="modal-body">
            <form method="POST" action="{% url 'comprobantes:crear' %}">
                {% csrf_token %}
                <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:20px;margin-bottom:20px;background:var(--gray-50);padding:20px;border-radius:var(--radius-md);border:1.5px solid var(--gray-100);">
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="empresa_id" class="form-label" style="color:var(--primary-700);font-weight:600;">
                            <i class="bi bi-building"></i> Empresa <span style="color:var(--danger);">*</span>
                        </label>
                        <div class="input-group-professional">
                            <input type="hidden" name="empresa_id" id="empresa_id" required onchange="checkRequirements()">
                            <input type="text" id="empresa_codigo" class="code-input" placeholder="Código" 
                                   onblur="searchByCode('empresa', 'empresa_id', 'empresa_name')"
                                   onkeydown="if(event.key === 'Enter') { event.preventDefault(); openSelector('empresa', 'empresa_id', 'empresa_name', null, this.value); }">
                            <span id="empresa_name" class="display-name">Seleccionar...</span>
                            <button type="button" class="btn-dots-pro" onclick="openSelector('empresa', 'empresa_id', 'empresa_name')">
                                <i class="bi bi-three-dots"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom:0;">
                        <label for="cliente_id" class="form-label" style="color:var(--primary-700);font-weight:600;">
                            <i class="bi bi-person"></i> Cliente <span style="color:var(--danger);">*</span>
                        </label>
                        <div class="input-group-professional">
                            <input type="hidden" name="cliente_id" id="cliente_id" required onchange="checkRequirements()">
                            <input type="text" id="cliente_codigo" class="code-input" placeholder="Código" 
                                   onblur="searchByCode('cliente', 'cliente_id', 'cliente_name')"
                                   onkeydown="if(event.key === 'Enter') { event.preventDefault(); openSelector('cliente', 'cliente_id', 'cliente_name', null, this.value); }">
                            <span id="cliente_name" class="display-name">Seleccionar...</span>
                            <button type="button" class="btn-dots-pro" onclick="openSelector('cliente', 'cliente_id', 'cliente_name')">
                                <i class="bi bi-three-dots"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom:0;">
                        <label for="tipo" class="form-label" style="color:var(--primary-700);font-weight:600;">
                            <i class="bi bi-file-earmark-text"></i> Tipo <span style="color:var(--danger);">*</span>
                        </label>
                        <select class="form-select" name="tipo" id="tipo" required>
                            <option value="01">Factura</option>
                            <option value="03">Boleta</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom:0;">
                        <label for="fecha" class="form-label" style="color:var(--primary-700);font-weight:600;">
                            <i class="bi bi-calendar3"></i> Fecha <span style="color:var(--danger);">*</span>
                        </label>
                        <input type="date" class="form-control" name="fecha" id="fecha" value="{{ today }}" required>
                    </div>
                </div>

                <div id="restriction-overlay" style="position:relative;">
                    <div id="restriction-message" style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.7);backdrop-filter:blur(2px);border-radius:var(--radius-md);border:2px dashed var(--gray-300);">
                        <div style="text-align:center;padding:20px;background:white;box-shadow:var(--shadow-lg);border-radius:var(--radius-md);">
                            <i class="bi bi-lock-fill" style="font-size:32px;color:var(--warning-500);"></i>
                            <p style="margin-top:10px;font-weight:600;color:var(--gray-700);">Seleccione empresa y cliente para agregar productos</p>
                        </div>
                    </div>
                    
                    <h5 style="font-family:var(--font-display);font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;">
                        <i class="bi bi-list-check" style="color:var(--primary-600);"></i> Detalles del Comprobante
                    </h5>
                <div id="detalles-container">
                    <div class="detalle-item" style="display:flex;gap:12px;align-items:flex-end;margin-bottom:12px;">
                        <div class="form-group" style="flex:3;margin-bottom:0;">
                            <label class="form-label">Producto <span style="color:var(--danger);">*</span></label>
                            <div style="position:relative;">
                                <input type="hidden" name="producto_id" required>
                                <input type="text" class="form-control producto-display" 
                                       placeholder="Escribe nombre de producto y presiona Enter..." 
                                       onkeydown="if(event.key === 'Enter') { event.preventDefault(); openSelector('producto', null, null, this.closest('.detalle-item'), this.value); }"
                                       style="background:white; padding-right:12px;">
                            </div>
                        </div>
                        <div class="form-group" style="flex:1;margin-bottom:0;">
                            <label class="form-label">Cantidad</label>
                            <input type="number" class="form-control" name="cantidad" step="0.01" value="1" required>
                        </div>
                        <div class="form-group" style="flex:1;margin-bottom:0;">
                            <label class="form-label">Precio Unit.</label>
                            <input type="number" class="form-control" name="precio_unitario" step="0.01" required>
                        </div>
                        <button type="button" class="btn-icon danger btn-remove-detalle" style="border:1.5px solid var(--gray-200);height:42px;width:42px;">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>

                <button type="button" class="btn btn-secondary btn-sm" id="add-detalle">
                    <i class="bi bi-plus-lg"></i> Agregar Línea
                </button>
                </div> <!-- End restriction-overlay -->

                <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--gray-100);">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('nuevoComprobanteModal')">
                        <i class="bi bi-x-lg"></i> Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-floppy"></i> Guardar Comprobante
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Nuevo Cliente -->
<div class="modal-overlay" id="nuevoClienteModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">
                <i class="bi bi-person-plus" style="color:var(--primary-600);"></i>
                Nuevo Cliente
            </h2>
            <button class="modal-close" onclick="closeModal('nuevoClienteModal')">
                <i class="bi bi-x"></i>
            </button>
        </div>
        <div class="modal-body">
            <form method="POST" action="{% url 'clientes:crear' %}">
                {% csrf_token %}
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;margin-bottom:16px;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="codigo_cliente" class="form-label">Código</label>
                        <input type="text" id="codigo_cliente" readonly class="form-control" style="background:var(--gray-50);" placeholder="Automático">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="tipo_doc" class="form-label">Tipo Doc. <span style="color:var(--danger);">*</span></label>
                        <select name="tipo_doc" id="tipo_doc" required class="form-select" onchange="updateDocValidation(this)">
                            <option value="1">DNI</option>
                            <option value="6" selected>RUC</option>
                            <option value="4">C. Extranjería</option>
                            <option value="7">Pasaporte</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="num_doc" class="form-label">N° Documento <span style="color:var(--danger);">*</span></label>
                        <input type="text" name="num_doc" id="num_doc" required 
                               maxlength="10" minlength="10" pattern="[0-9]{10}"
                               title="El RUC debe tener 10 dígitos"
                               class="form-control">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="ubigeo" class="form-label">Ubigeo</label>
                        <input type="text" name="ubigeo" id="ubigeo" maxlength="6" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label for="razon_social" class="form-label">Razón Social / Nombre <span style="color:var(--danger);">*</span></label>
                    <input type="text" name="razon_social" id="razon_social" required maxlength="200" class="form-control">
                </div>

                <div class="form-group">
                    <label for="direccion" class="form-label">Dirección</label>
                    <textarea name="direccion" id="direccion" rows="2" class="form-control"></textarea>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" name="email" id="email" class="form-control">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="text" name="telefono" id="telefono" 
                               maxlength="9" minlength="9" pattern="[0-9]{9}"
                               title="El teléfono debe tener exactamente 9 dígitos"
                               placeholder="999999999" class="form-control">
                    </div>
                </div>

                <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--gray-100);">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('nuevoClienteModal')">
                        <i class="bi bi-x-lg"></i> Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-floppy"></i> Guardar Cliente
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Nuevo Producto -->
<div class="modal-overlay" id="nuevoProductoModal">
    <div class="modal-content" style="max-width:820px;">
        <div class="modal-header">
            <h2 class="modal-title">
                <i class="bi bi-box-seam" style="color:var(--primary-600);"></i>
                Nuevo Producto
            </h2>
            <button class="modal-close" onclick="closeModal('nuevoProductoModal')">
                <i class="bi bi-x"></i>
            </button>
        </div>
        <div class="modal-body">
            <form method="POST" action="{% url 'productos:crear' %}">
                {% csrf_token %}
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="codigo_prod" class="form-label">Código</label>
                        <input type="text" id="codigo_prod" readonly class="form-control" style="background:var(--gray-50);" placeholder="Automático">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="categoria" class="form-label">Categoría</label>
                        <select name="categoria" id="categoria" class="form-select">
                            <option value="">— Sin categoría —</option>
                            {% for cat in categorias %}
                            <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="tipo_operacion" class="form-label">Tipo de Operación</label>
                        <select name="tipo_operacion" id="tipo_operacion" class="form-select">
                            <option value="GRAVADA">Gravada</option>
                            <option value="EXONERADA">Exonerada</option>
                            <option value="INAFECTA">Inafecta</option>
                            <option value="GRATUITA">Operación Gratuita</option>
                            <option value="EXPORTACION">Exportación</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="descripcion" class="form-label">Descripción <span style="color:var(--danger);">*</span></label>
                    <textarea name="descripcion" id="descripcion" rows="2" required maxlength="500" class="form-control"></textarea>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:16px;align-items:flex-end;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="unidad_medida" class="form-label">Unidad de Medida</label>
                        <select name="unidad_medida" id="unidad_medida" class="form-select">
                            <option value="NIU">NIU (Unidad)</option>
                            <option value="KG">KG (Kilogramo)</option>
                            <option value="LT">LT (Litro)</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="precio_unitario" class="form-label">Precio Unitario <span style="color:var(--danger);">*</span></label>
                        <input type="number" name="precio_unitario" id="precio_unitario" required step="0.01" min="0" class="form-control">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="cod_tipo_afectacion" class="form-label">Afectación IGV</label>
                        <select name="cod_tipo_afectacion" id="cod_tipo_afectacion" class="form-select">
                            <option value="10">10 - Gravado</option>
                            <option value="20">20 - Exonerado</option>
                            <option value="30">30 - Inafecto</option>
                        </select>
                    </div>
                    <div style="padding-bottom:2px;">
                        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                            <input type="checkbox" name="afecto_igv" checked style="width:16px;height:16px;">
                            <span class="form-label" style="margin-bottom:0;">Afecto IGV</span>
                        </label>
                    </div>
                </div>

                <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--gray-100);">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('nuevoProductoModal')">
                        <i class="bi bi-x-lg"></i> Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-floppy"></i> Guardar Producto
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Scripts for dynamic rows (comprobante)
document.addEventListener('DOMContentLoaded', function() {
    const addBtn = document.getElementById('add-detalle');
    if (addBtn) {
        addBtn.addEventListener('click', function() {
            const container = document.getElementById('detalles-container');
            const newRow = container.querySelector('.detalle-item').cloneNode(true);
            newRow.querySelector('input[name="producto_id"]').value = '';
            newRow.querySelector('.producto-display').value = '';
            newRow.querySelectorAll('input[type="number"]').forEach(input => {
                if (input.name === 'cantidad') input.value = '1';
                else input.value = '';
            });
            container.appendChild(newRow);
        });
    }

    document.addEventListener('click', function(e) {
        if (e.target.closest('.btn-remove-detalle')) {
            const row = e.target.closest('.detalle-item');
            if (document.querySelectorAll('.detalle-item').length > 1) {
                row.remove();
            }
        }
    });
});

/**
 * Verifica si se han seleccionado empresa y cliente para habilitar los detalles
 */
function checkRequirements() {
    const empresaId = document.getElementById('empresa_id').value;
    const clienteId = document.getElementById('cliente_id').value;
    const overlay = document.getElementById('restriction-message');
    const container = document.getElementById('detalles-container');
    const addBtn = document.getElementById('add-detalle');

    if (empresaId && clienteId) {
        overlay.style.display = 'none';
        container.style.opacity = '1';
        container.style.pointerEvents = 'auto';
        if (addBtn) addBtn.disabled = false;
    } else {
        overlay.style.display = 'flex';
        container.style.opacity = '0.5';
        container.style.pointerEvents = 'none';
        if (addBtn) addBtn.disabled = true;
    }
}

/**
 * Carga el formulario de edición en un modal vía AJAX
 */
function openEditModal(url) {
    const modal = document.getElementById('editModal');
    const content = document.getElementById('editModalContent');
    
    content.innerHTML = `
        <div style="padding:60px; text-align:center;">
            <div class="spinner" style="width:40px;height:40px;border:3px solid var(--primary-100);border-top-color:var(--primary-600);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
            <p style="color:var(--gray-500);font-weight:500;">Cargando formulario...</p>
        </div>
    `;
    
    openModal('editModal');
    
    fetch(url)
        .then(response => response.text())
        .then(html => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const mainContent = doc.querySelector('.card-body') || doc.querySelector('form');
            const title = doc.querySelector('.page-title') || doc.querySelector('.card-title');
            
            if (mainContent) {
                // Eliminar botones redundantes del form si existen (como "Volver")
                const backBtn = mainContent.querySelector('a.btn-secondary, .btn-outline');
                if (backBtn) backBtn.remove();

                content.innerHTML = `
                    <div class="modal-header">
                        <h2 class="modal-title">
                            <i class="bi bi-pencil-square" style="color:var(--primary-600);"></i> 
                            ${title ? title.innerText.trim() : 'Editar Registro'}
                        </h2>
                        <button class="modal-close" onclick="closeModal('editModal')">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                    <div class="modal-body">${mainContent.innerHTML}</div>
                `;
                
                // Re-bind scripts if necessary (like doc validation)
                const newSelect = content.querySelector('select[name="tipo_doc"]');
                if (newSelect && typeof updateDocValidation === 'function') {
                    updateDocValidation(newSelect);
                }
            } else {
                content.innerHTML = `<div class="modal-body">${html}</div>`;
            }
        })
        .catch(err => {
            content.innerHTML = `<div class="modal-body text-danger">Error al cargar el formulario: ${err}</div>`;
        });
}

// Inicializar estado
setTimeout(checkRequirements, 500);
</script>

<!-- Modal de Edición Genérico -->
<div class="modal-overlay" id="editModal">
    <div class="modal-content" id="editModalContent" style="max-width:800px;">
        <!-- Dinámico -->
    </div>
</div>

<!-- Modal de Confirmación Global -->
<div class="modal-overlay" id="confirmModal" style="z-index:2000;">
    <div class="modal-content" style="max-width:400px;text-align:center;padding:30px;">
        <div id="confirm-icon-container" style="width:70px;height:70px;background:var(--danger-50);color:var(--danger-600);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
            <i class="bi bi-exclamation-triangle" style="font-size:32px;"></i>
        </div>
        <h3 id="confirm-title" style="font-size:20px;font-weight:700;margin-bottom:10px;">¿Está seguro?</h3>
        <p id="confirm-message" style="color:var(--gray-600);margin-bottom:24px;">Esta acción no se puede deshacer.</p>
        
        <div style="display:flex;gap:12px;justify-content:center;">
            <button type="button" class="btn btn-secondary" onclick="closeModal('confirmModal')" style="flex:1;">
                Cancelar
            </button>
            <button type="button" id="confirm-action-btn" class="btn btn-danger" style="flex:1;">
                Sí, eliminar
            </button>
        </div>
    </div>
</div>

<script>
/**
 * Abre el modal de confirmación
 * @param {string} title - Título del modal
 * @param {string} message - Mensaje descriptivo
 * @param {function} callback - Función a ejecutar si confirma
 * @param {string} type - 'danger' o 'primary'
 */
function showConfirm(title, message, callback, type = 'danger') {
    document.getElementById('confirm-title').innerText = title;
    document.getElementById('confirm-message').innerText = message;
    
    const btn = document.getElementById('confirm-action-btn');
    const iconContainer = document.getElementById('confirm-icon-container');
    
    if (type === 'danger') {
        btn.className = 'btn btn-danger';
        iconContainer.style.background = 'var(--danger-50)';
        iconContainer.style.color = 'var(--danger-600)';
    } else {
        btn.className = 'btn btn-primary';
        iconContainer.style.background = 'var(--primary-50)';
        iconContainer.style.color = 'var(--primary-600)';
    }

    btn.onclick = function() {
        callback();
        closeModal('confirmModal');
    };

    openModal('confirmModal');
}
</script>
