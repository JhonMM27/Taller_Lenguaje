{% extends 'base.html' %}

{% block title %}Nueva Nota de Crédito{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-display font-semibold text-slate-800 flex items-center gap-3">
        <i class="bi bi-journal-minus text-primary-600"></i> Nueva Nota de Crédito
    </h1>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
    <form method="POST" class="space-y-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div>
                <label for="serie" class="block text-sm font-medium text-slate-700 mb-2">Serie</label>
                <input type="text" name="serie" id="serie" required maxlength="4" value="FF01"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
            </div>
            <div>
                <label for="numero" class="block text-sm font-medium text-slate-700 mb-2">Número</label>
                <input type="number" name="numero" id="numero" required min="1" value="1"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
            </div>
            <div>
                <label for="fecha" class="block text-sm font-medium text-slate-700 mb-2">Fecha</label>
                <input type="date" name="fecha" id="fecha" required value="{{ today|date:'Y-m-d' }}"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
            </div>
            <div>
                <label for="comprobante_referencia" class="block text-sm font-medium text-slate-700 mb-2">Comprobante de Referencia</label>
                <select name="comprobante_referencia" id="comprobante_referencia" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
                    <option value="">Seleccionar...</option>
                    {% for comp in comprobantes %}
                    <option value="{{ comp.id }}">{{ comp.serie.serie }}-{{ comp.numero|stringformat:"08d" }} | {{ comp.cliente.razon_social|truncatechars:30 }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="tipo_nota" class="block text-sm font-medium text-slate-700 mb-2">Motivo de la Nota</label>
                <select name="tipo_nota" id="tipo_nota" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
                    {% for value, label in motivos %}
                    <option value="{{ value }}">{{ value }} - {{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="monto_afectado" class="block text-sm font-medium text-slate-700 mb-2">Monto Afectado</label>
                <input type="number" name="monto_afectado" id="monto_afectado" required step="0.01" min="0"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition">
            </div>
        </div>
        <div>
            <label for="descripcion" class="block text-sm font-medium text-slate-700 mb-2">Descripción</label>
            <textarea name="descripcion" id="descripcion" rows="3" placeholder="Descripción adicional (opcional)"
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition"></textarea>
        </div>
        <div class="flex justify-end gap-3">
            <a href="{% url 'notas_credito:lista' %}" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium transition">
                Cancelar
            </a>
            <button type="submit" class="px-5 py-2.5 bg-primary-500 hover:bg-primary-600 text-white rounded-xl font-medium transition shadow-lg shadow-primary-500/30 flex items-center gap-2">
                <i class="bi bi-save"></i> Crear Nota de Crédito
            </button>
        </div>
    </form>
</div>
{% endblock %}
