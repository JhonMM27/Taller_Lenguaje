services:
  nginx:
    image: nginx:alpine
    container_name: sunat_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/staticfiles
      - media_volume:/media
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - sunat_network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sunat_backend
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./wsdl:/app/wsdl:ro
      - ./certs:/app/certs:ro
      # Permite escritura para la generación y guardado de archivos de migración de Django en la máquina host.
      - ./apps:/app/apps
      - ./templates:/app/templates:ro
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_DB: facturacion_db
      POSTGRES_USER: sunat_user
      POSTGRES_PASSWORD: sunat_pass_2026
      DEBUG: "False"
      SECRET_KEY: django-insecure-change-me-in-production-abc123xyz-2026
      SUNAT_CERT_PATH: /app/certs/CT2602141470.pfx
      SUNAT_CERT_PASSWORD: Lavagna2026
      # ============================================================
      # MODO MOCK: SIMULA SUNAT - NO ENVIA COMPROBANTES REALES
      # ============================================================
      # True  = SIMULACION (las facturas NO se envian a SUNAT)
      # False = CONEXION REAL (se envian a SUNAT BETA)
      # ============================================================
      # IMPORTANTE: Para conexion real necesitas:
      #   1. Credenciales SOL validas de tu empresa
      #   2. Certificado digital .pfx vigente
      #   3. Contrato con un OSE certificador o acceso a SUNAT Beta
      # ============================================================
      SUNAT_OSE_MOCK: "False"
      # URL del WSDL de SUNAT Beta (solo se usa si SUNAT_OSE_MOCK=False)
      SUNAT_OSE_WSDL: https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService
      # Credenciales de prueba de SUNAT Beta (reemplazar con credenciales reales)
      SUNAT_OSE_RUC: "20103129061"
      SUNAT_OSE_USUARIO: "MODDATOS"
      SUNAT_OSE_PASSWORD: "MODDATOS"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sunat_network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sunat_postgres
    environment:
      POSTGRES_DB: facturacion_db
      POSTGRES_USER: sunat_user
      POSTGRES_PASSWORD: sunat_pass_2026
      LANG: es_PE.UTF-8
      LC_ALL: es_PE.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sunat_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunat_user -d facturacion_db || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sunat_pgadmin
    ports:
      - "5051:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@sunat.local.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - sunat_network
    restart: unless-stopped

networks:
  sunat_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  static_volume:
  media_volume: