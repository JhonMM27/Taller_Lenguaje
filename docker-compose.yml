services:
  nginx:
    image: nginx:alpine
    container_name: sunat_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/staticfiles
      - media_volume:/media
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - sunat_network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sunat_backend
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_DB: facturacion_db
      POSTGRES_USER: sunat_user
      POSTGRES_PASSWORD: sunat_pass_2026
      DEBUG: "False"
      SECRET_KEY: django-insecure-change-me-in-production-abc123xyz-2026
      SUNAT_CERT_PATH: /app/media/CT2602141470.pfx
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sunat_network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sunat_postgres
    environment:
      POSTGRES_DB: facturacion_db
      POSTGRES_USER: sunat_user
      POSTGRES_PASSWORD: sunat_pass_2026
      LANG: es_PE.UTF-8
      LC_ALL: es_PE.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sunat_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunat_user -d facturacion_db || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sunat_pgadmin
    ports:
      - "5051:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@sunat.local.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - sunat_network
    restart: unless-stopped

networks:
  sunat_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  static_volume:
  media_volume: