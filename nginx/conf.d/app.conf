# ============================================================
# NGINX - Virtual Host para Aplicacion Django
# ============================================================
# Configuracion del servidor que recibe las solicitudes HTTP/HTTPS
# y las redirige al backend Django via Gunicorn.
# ============================================================

# Upstream define el servidor backend de Django
# "backend" es el nombre del servicio en docker-compose que resolves
# via DNS interno de Docker.
upstream backend {
    server backend:8000;
}

server {
    # Escucha en puerto 80 (HTTP)
    # Para HTTPS ver bloque server en puerto 443
    listen 80;
    server_name localhost;

    # ============================================================
    # LIMITES DE UPLOAD
    # ============================================================
    # Importante para envios de XML firmados a SUNAT
    # El limite por defecto de nginx es 1MB, insuficiente para
    # comprobantes con muchos items
    client_max_body_size 10M;

    # ============================================================
    # ARCHIVOS ESTATICOS (CSS, JS, imagenes)
    # ============================================================
    # Nginx sirve directamente sin pasar por Django - mucho mas rapido
    location /static/ {
        # Alias apunta al volumen compartido con Django
        # Cuando Django hace collectstatic, los archivos van aqui
        alias /staticfiles/;
        expires 30d;                    # Cache en navegador por 30 dias
        add_header Cache-Control "public, immutable";
        
        # Log de requests de static para monitoreo (opcional)
        access_log off;
    }

    # ============================================================
    # ARCHIVOS MEDIA (logos, facturas PDF, etc)
    # ============================================================
    location /media/ {
        alias /media/;
        expires 7d;                     # Cache por 7 dias
        add_header Cache-Control "public";
    }

    # ============================================================
    # API REST (Django REST Framework)
    # ============================================================
    location /api/ {
        # Redirige todas las solicitudes /api/* al backend Django
        proxy_pass http://backend;
        
        # Preserva la informacion del cliente original
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeouts para API - previene hanging connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================================
    # APLICACION PRINCIPAL (todo lo demas)
    # ============================================================
    location / {
        # Redirige al backend Django
        proxy_pass http://backend;
        
        # Headers para seguridad y diagnostico
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Para WebSocket (si se usa en el futuro)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================================
    # PAGINAS DE ERROR PERSONALIZADAS
    # ============================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# ============================================================
# SERVIDOR HTTPS (Puerto 443)
# ============================================================
# Usa certificado autofirmado para desarrollo local.
# En produccion usar Let's Encrypt o certificado real.
server {
    listen 443 ssl;
    server_name localhost;

    # Certificado SSL autofirmado (generado por scripts/generate_ssl.sh)
    # Para produccion, usar certificados de Let's Encrypt
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Configuracion SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Mismos locations que HTTP
    client_max_body_size 10M;

    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /media/;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
