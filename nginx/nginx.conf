# ============================================================
# NGINX - Configuracion Principal
# ============================================================
# Este archivo define la configuracion global de Nginx.
# Incluye worker processes, logging, gzip y configuracion de red.
# No necesita modificarse en la mayoria de casos.
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Numero maximo de conexiones simultaneas por worker
    worker_connections 1024;
}

http {
    # Inclusion de tipos MIME para Content-Type correcto
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de log personalizado para analisis posterior
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Optimizaciones de red para mejor rendimiento
    sendfile on;
    tcp_nopush on;       # Envia headers y body en paquetes optimizados
    tcp_nodelay on;      # Elimina delay de Nagle
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ============================================================
    # COMPRESION GZIP
    # ============================================================
    # Reduce el tamano de transferencia para archivos de texto
    gzip on;
    gzip_vary on;         # Anade header Vary: Accept-Encoding
    gzip_proxied any;     # Comprime respuestas de proxys
    gzip_comp_level 6;    # Nivel de compresion (1-9, 6 es buen balance)
    gzip_min_length 1000;# Solo comprime archivos mayores a 1KB
    
    # Tipos de contenido a comprimir
    gzip_types text/plain text/css text/xml text/javascript 
                   application/json application/javascript application/xml+rss
                   application/atom+xml image/svg+xml;

    # Inclusion de configuraciones de virtual hosts
    include /etc/nginx/conf.d/*.conf;
}
